<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[[ polaris.page.title_seo ]]</title>
  [[ func | &headers ]]
</head>
<body>

  <div class="flex min-h-screen flex-col justify-center items-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <h2 class="text-center text-4xl font-bold tracking-tight text-gray-900">Campamento</h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
      <form id="login-form" class="space-y-4">
        
        <div>
          <label for="email" class="block text-sm/6 font-medium text-gray-900">[[ label | email ]]</label>
          <div class="mt-2">
            <input
              id="email"
              name="email"
              type="text"
              autocomplete="email"
              placeholder="johndoe@example.com"
              class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm/6"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm/6 font-medium text-gray-900">[[ label | password ]]</label>
          </div>
          <div class="mt-2">
            <input
              id="password"
              name="password"
              type="password"
              class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm/6"
            >
          </div>          
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
            [[ label | login_button ]]
          </button>
          <a href="/signup" class="h-fit flex w-full justify-center rounded-md border border-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-indigo-600 shadow-sm hover:bg-indigo-500 hover:text-white transition-colors duration-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
            [[ label | create_account_button ]]
          </a>
        </div>

        <div class="flex justify-center items-center">
          <a href="/recover-password" class="mt-4 text-sm text-blue-500 hover:underline text-center">
            [[ label | forgot_password_button ]]
          </a>
        </div>

      </form>

    </div>
  </div>

  <script src="[[ polaris.actual_dir ]]/[[ polaris.page.page_title ]].js"></script>
</body>
</html>
