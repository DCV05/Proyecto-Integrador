<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500</title>
  <style>
    body {
      background: #55aeea;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .page-500 {
      text-align: center;
    }

    .error-number {
      font-size: 120px;
      font-weight: bold;
      line-height: 1;
      color: black;
      border-radius: 50%;
      width: 300px;
      height: 300px;
      border: 8px black solid;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .page-500-link {
      margin-top: 20px;
    }

    .page-500-link a {
      color: black;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="page-500">
    <div class="error-number">500</div>
    <div class="page-500-link">
      <a href="/">Go home</a>
    </div>
  </div>
</body>
</html>
