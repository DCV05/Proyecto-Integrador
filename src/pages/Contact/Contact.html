<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[[ polaris.page.title_seo ]]</title>
  [[ func | &headers ]]
  <link rel="stylesheet" href="/css/landing.css">
  <script src="/js/landing.js"></script>
</head>
<body class="min-h-screen flex flex-col">

  <header>
    [[ func | &landing_navbar | true ]]
  </header>

  <main class="flex-1 flex items-center justify-center mt-32">
    <div class="grid grid-cols-1 gap-2 w-full max-w-xl">
      <h2 class="text-left text-4xl font-bold tracking-tight text-gray-900">
        [[ label | contact ]]
      </h2>

      <div class="bg-white shadow-xl rounded-lg p-8 w-full space-y-6">
        
        <form id="contact-form" class="space-y-4">
          [[ func | &custom_input | email | email ]]
          [[ func | &custom_input | email_subject | text | | 0 ]]
          [[ func | &custom_textarea | message ]]
          
          <div class="grid grid-cols-2 gap-4 mt-4">
            <button type="submit" class="apple-button" disabled>
              [[ label | submit_button ]]
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <footer>
    [[ func | &landing_footer | false ]]
  </footer>

  <script src="[[ polaris.actual_dir ]]/[[ polaris.page.page_title ]].js"></script>
</body>
</html>
