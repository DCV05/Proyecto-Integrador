<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <metaname="viewport" content="width=device-width, initial-scale=1.0">
  <title>[[ polaris.page.title_seo ]]</title>
  [[ func | &headers ]]
</head>

<body class="overflow-hidden flex flex-col min-h-screen relative">

  [[ func | &panel_interface ]]
  
  <div class="page-content">
    <div class="mx-auto w-full p-2 md:p-4 space-y-12">
      <div>

        <h2 class="subtitle font-semibold my-4">[[ label | tutors ]]</h2>

        <div class="p-block">
          <h6>[[ label | filters ]]</h6>
  
          <form name="filters" id="filters_tutors" class="flex flex-row justify-between items-end gap-4 mt-2">
            <div class="flex gap-3 items-end">
  
              <div class="p-control">
                <i class="icon">search</i>
                <input 
                  type="search" 
                  name="f_search" 
                  id="f_search" 
                  placeholder="[[ label | search ]]..." 
                  autocomplete="off"
                  class="border-0"
                >
                <label for="f_search">
                  <img src="[[ polaris.assets ]]/img/mac_shortcut.svg" alt="Mac Shortcut">
                </label>
              </div>
          
              <div class="flex gap-3">
                <button type="button" id="clean-filters" class="p-button">
                  <i class="icon">restart_alt</i>
                  <span>[[ label | clean_filters ]]</span>
                </button>
              </div>

              <button type="button" id="btn-add-tutor" class="p-button">
                <i class="icon">add</i>
                <span>[[ label | add_tutor ]]</span>
              </button>
  
            </div>
          </form>
        </div>

        [[ func | table_tutors ]]
      </div>
     
      <div>
        <h2 class="subtitle font-semibold my-4">[[ label | participants ]]</h2>

        <div class="p-block">
          <h6>[[ label | filters ]]</h6>
  
          <form name="filters" id="filters_participants" class="flex flex-row justify-between items-end gap-4 mt-2">
            <div class="flex gap-3 items-end">
  
              <div class="p-control">
                <i class="icon">search</i>
                <input 
                  type="search" 
                  name="f_search" 
                  id="f_search" 
                  placeholder="[[ label | search ]]..." 
                  autocomplete="off"
                  class="border-0"
                >
                <label for="f_search">
                  <img src="[[ polaris.assets ]]/img/mac_shortcut.svg" alt="Mac Shortcut">
                </label>
              </div>
          
              <div class="flex gap-3">
                <button type="button" id="clean-filters" class="p-button">
                  <i class="icon">restart_alt</i>
                  <span>[[ label | clean_filters ]]</span>
                </button>
              </div>

              <button type="button" id="btn-add-participant" class="p-button">
                <i class="icon">add</i>
                <span>[[ label | add_participant ]]</span>
              </button>
  
            </div>
          </form>
        </div>

        [[ func | table_participants ]]
      </div>
    </div>
  </div>

  <script src="[[ polaris.actual_dir ]]/[[ polaris.page.page_title ]].js"></script>
</body>

</html>
