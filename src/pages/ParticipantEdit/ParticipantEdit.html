<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[[ polaris.page.title_seo ]]</title>
  [[ func | &headers ]]
</head>
<body>
  <div class="flex min-h-screen flex-col justify-center items-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full max-w-3xl">
      <h2 class="text-center text-4xl font-bold tracking-tight text-gray-900">
        [[ label | modify_participant_data ]]
      </h2>

      <div class="mt-10 sm:mx-auto sm:w-full">
        <form id="edit-participant-form" class="space-y-4">

          <section class="flex flex-col space-y-4" id="participant_section">

            <h3 class="text-2xl font-semibold text-gray-700">[[ label | participant_info ]]</h3>

            <div>
              <label for="child_full_name" class="block text-sm font-medium text-gray-900">
                [[ label | child_full_name ]]
              </label>
              <div class="mb-4">
                <input
                  type="text"
                  id="child_full_name"
                  name="child_full_name"
                  placeholder="[[ label | child_full_name_placeholder ]]"
                  class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
                >
              </div>
            </div>

            <div>
              <label for="child_birth_date" class="block text-sm font-medium text-gray-900">
                [[ label | child_birth_date ]]
              </label>
              <div class="mb-4">
                <input
                  type="date"
                  id="child_birth_date"
                  name="child_birth_date"
                  class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
                >
              </div>
            </div>

            <div>
              <label for="child_address" class="block text-sm font-medium text-gray-900">
                [[ label | child_address ]]
              </label>
              <div class="mb-4">
                <input
                  type="text"
                  id="child_address"
                  name="child_address"
                  placeholder="[[ label | child_address_placeholder ]]"
                  class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
                >
              </div>
            </div>

            <div>
              <label for="child_state" class="block text-sm font-medium text-gray-900">
                [[ label | child_state ]]
              </label>
              <div class="mb-4">
                <input
                  type="text"
                  id="child_state"
                  name="child_state"
                  placeholder="[[ label | child_state_placeholder ]]"
                  class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
                >
              </div>
            </div>

            <div>
              <label for="child_province" class="block text-sm font-medium text-gray-900">
                [[ label | child_province ]]
              </label>
              <div class="mb-4">
                <input
                  type="text"
                  id="child_province"
                  name="child_province"
                  placeholder="[[ label | child_province_placeholder ]]"
                  class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
                >
              </div>
            </div>

            <div>
              <label for="child_group" class="block text-sm font-medium text-gray-900">
                [[ label | child_group ]]
              </label>
              <div class="mb-4">
                <input
                  type="text"
                  id="child_group"
                  name="child_group"
                  placeholder="[[ label | child_group_placeholder ]]"
                  class="block px-3 w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600"
                >
              </div>
            </div>

            <div class="flex justify-end mt-4 col-span-2">
              <button
                type="submit"
                class="bg-indigo-600 text-white px-4 py-2 rounded">
                [[ label | save_changes ]]
              </button>
            </div>

          </section>

        </form>
      </div>
    </div>
  </div>

  <script src="[[ polaris.actual_dir ]]/[[ polaris.page.page_title ]].js"></script>
</body>
</html>
